info:
  contact:
    name: MainWP Support
    url: https://mainwp.com/support/
  license:
    name: GPLv3 or later
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: |
    REST API v2 for the MainWP Dashboard plugin. All endpoints return JSON and
    require an API key sent as a bearer token in the `Authorization` header.
    Create keys in your Dashboard under MainWP Dashboard > API Access > API Keys.

    Endpoint paths are relative to the WordPress site running your MainWP
    Dashboard, so a full request URL looks like
    `https://your-dashboard.example.com/wp-json/mainwp/v2/sites`.

    Endpoint reference with examples: https://docs.mainwp.com/api-reference/rest-api/overview
  title: MainWP Dashboard REST API
  version: 6.1.5
openapi: 3.1.0
servers:
  - url: "{dashboardUrl}"
    description: The WordPress site where your MainWP Dashboard plugin is installed.
    variables:
      dashboardUrl:
        default: https://your-dashboard.example.com
        description: Base URL of the WordPress site running your MainWP Dashboard.
security:
  - bearerAuth: []
tags:
  - name: Sites
    description: 'Connected child sites: inventory, connection state, plugins, themes, and per-site actions.'
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/sites
  - name: Clients
    description: Client records and the custom client fields defined on the Dashboard.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/clients
  - name: Tags
    description: Tags, also called groups, and the sites and clients they cover.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/tags
  - name: Updates
    description: Available core, plugin, theme, and translation updates, plus running and ignoring them.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/updates
  - name: Costs
    description: Cost Tracker records and the sites and clients they are assigned to.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/costs
  - name: Posts
    description: Posts on child sites. Each route reads or writes on the child site while the request runs.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/posts
  - name: Pages
    description: Pages on child sites. Each route reads or writes on the child site while the request runs.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/pages
  - name: Users
    description: Users on child sites, including CSV import and administrator password changes.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/users
  - name: Monitors
    description: 'Uptime monitors: current status, heartbeat history, incidents, and monitor settings.'
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/monitoring
  - name: Settings
    description: Dashboard settings grouped by settings screen, plus the maintenance tools.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/settings
  - name: API Keys
    description: REST API keys for the Dashboard, including the legacy v1 keys the list route returns.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/api-keys
  - name: Batch
    description: The global batch route, which fans a single request out across several controllers.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/batch
  - name: Comments
    description: Comment moderation across child sites.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/extensions
  - name: Time Tracker
    description: Time tracking tasks, buckets, and per-client settings.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/extensions
  - name: SSL Monitor
    description: SSL certificate status for child sites served over HTTPS.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/extensions
  - name: Domain Monitor
    description: Domain registration and expiry data for child sites.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/extensions
  - name: Lighthouse
    description: Google PageSpeed Insights audits and their stored results.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/extensions
  - name: Pro Reports
    description: Activity data used to build client reports.
    externalDocs:
      description: Endpoint reference with examples.
      url: https://docs.mainwp.com/api-reference/rest-api/extensions
paths:
  /wp-json/mainwp/v2/batch:
    post:
      operationId: postBatch
      summary: Run grouped actions across controllers
      description: Runs grouped actions against the sites, clients, updates, costs, and tags controllers in one
        request. The response mirrors the request structure. The default limit is 100 items across all groups.
      tags:
        - Batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sites:
                  type: object
                  description: Site actions. Only this group takes the action arrays.
                  properties:
                    create:
                      type: array
                      description: Sites to connect. Same fields as `POST /sites/add`.
                      items:
                        $ref: '#/components/schemas/SiteCreateInput'
                    sync:
                      type: array
                      description: Site IDs to sync.
                      items:
                        type: integer
                    reconnect:
                      type: array
                      description: Site IDs to reconnect.
                      items:
                        type: integer
                    disconnect:
                      type: array
                      description: Site IDs to disconnect.
                      items:
                        type: integer
                    suspend:
                      type: array
                      description: Site IDs to suspend.
                      items:
                        type: integer
                    check:
                      type: array
                      description: Site IDs to run a connection check against.
                      items:
                        type: integer
                    remove:
                      type: array
                      description: Site IDs to remove from the Dashboard.
                      items:
                        type: integer
                    security:
                      type: array
                      description: Site IDs to return a security snapshot for.
                      items:
                        type: integer
                    plugins:
                      type: array
                      description: Site IDs to return the installed plugins for.
                      items:
                        type: integer
                    themes:
                      type: array
                      description: Site IDs to return the installed themes for.
                      items:
                        type: integer
                    non-mainwp-changes:
                      type: array
                      description: Site IDs to return changes made outside MainWP for.
                      items:
                        type: integer
                clients:
                  type: object
                  properties:
                    create:
                      type: array
                      description: Clients to create. Same fields as `POST /clients/add`.
                      items:
                        $ref: '#/components/schemas/ClientCreateInput'
                costs:
                  type: object
                  properties:
                    create:
                      type: array
                      description: Cost records to create. Same fields as `POST /costs/add`.
                      items:
                        $ref: '#/components/schemas/CostInput'
                tags:
                  type: object
                  properties:
                    create:
                      type: array
                      description: Tags to create. Same fields as `POST /tags/add`.
                      items:
                        $ref: '#/components/schemas/TagCreateInput'
                updates:
                  type: object
                  properties:
                    create:
                      type: array
                      description: 'Accepted by the route but not implemented: the updates controller has no create
                        handler, so every item comes back as an `invalid-method` error. Use the routes under `/updates`
                        instead.'
                      items:
                        type: object
      responses:
        '200':
          description: Per-item results, grouped the same way as the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: putBatch
      summary: Run grouped actions across controllers
      description: Runs grouped actions against the sites, clients, updates, costs, and tags controllers in one
        request. The response mirrors the request structure. The default limit is 100 items across all groups.
      tags:
        - Batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sites:
                  type: object
                  description: Site actions. Only this group takes the action arrays.
                  properties:
                    create:
                      type: array
                      description: Sites to connect. Same fields as `POST /sites/add`.
                      items:
                        $ref: '#/components/schemas/SiteCreateInput'
                    sync:
                      type: array
                      description: Site IDs to sync.
                      items:
                        type: integer
                    reconnect:
                      type: array
                      description: Site IDs to reconnect.
                      items:
                        type: integer
                    disconnect:
                      type: array
                      description: Site IDs to disconnect.
                      items:
                        type: integer
                    suspend:
                      type: array
                      description: Site IDs to suspend.
                      items:
                        type: integer
                    check:
                      type: array
                      description: Site IDs to run a connection check against.
                      items:
                        type: integer
                    remove:
                      type: array
                      description: Site IDs to remove from the Dashboard.
                      items:
                        type: integer
                    security:
                      type: array
                      description: Site IDs to return a security snapshot for.
                      items:
                        type: integer
                    plugins:
                      type: array
                      description: Site IDs to return the installed plugins for.
                      items:
                        type: integer
                    themes:
                      type: array
                      description: Site IDs to return the installed themes for.
                      items:
                        type: integer
                    non-mainwp-changes:
                      type: array
                      description: Site IDs to return changes made outside MainWP for.
                      items:
                        type: integer
                clients:
                  type: object
                  properties:
                    create:
                      type: array
                      description: Clients to create. Same fields as `POST /clients/add`.
                      items:
                        $ref: '#/components/schemas/ClientCreateInput'
                costs:
                  type: object
                  properties:
                    create:
                      type: array
                      description: Cost records to create. Same fields as `POST /costs/add`.
                      items:
                        $ref: '#/components/schemas/CostInput'
                tags:
                  type: object
                  properties:
                    create:
                      type: array
                      description: Tags to create. Same fields as `POST /tags/add`.
                      items:
                        $ref: '#/components/schemas/TagCreateInput'
                updates:
                  type: object
                  properties:
                    create:
                      type: array
                      description: 'Accepted by the route but not implemented: the updates controller has no create
                        handler, so every item comes back as an `invalid-method` error. Use the routes under `/updates`
                        instead.'
                      items:
                        type: object
      responses:
        '200':
          description: Per-item results, grouped the same way as the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchBatch
      summary: Run grouped actions across controllers
      description: Runs grouped actions against the sites, clients, updates, costs, and tags controllers in one
        request. The response mirrors the request structure. The default limit is 100 items across all groups.
      tags:

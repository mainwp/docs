  /wp-json/mainwp/v2/users:
    get:
      operationId: getUsers
      summary: List users across sites
      description: Lists users from the selected sites. Users are read from each child site while the request runs.
      tags:
        - Users
      parameters:
        - name: clients
          in: query
          description: Search by clients.
          required: false
          schema:
            type: string
        - name: groups
          in: query
          description: Search by tags.
          required: false
          schema:
            type: string
        - name: roles
          in: query
          description: Search by roles.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - administrator
                - subscriber
                - editor
                - author
                - contributor
        - name: search
          in: query
          description: Search by user name.
          required: false
          schema:
            type: string
        - name: websites
          in: query
          description: Websites child site field IDs.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/users/create:
    post:
      operationId: postUsersCreate
      summary: Create a user on selected sites
      description: Creates the same user account on every selected site and reports which sites succeeded.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clients:
                  type: string
                  description: Search by clients.
                email:
                  type: string
                  description: Email.
                first_name:
                  type: string
                  description: First name.
                groups:
                  type: string
                  description: Search by tags.
                last_name:
                  type: string
                  description: Last name.
                password:
                  type: string
                  description: Password.
                role:
                  type: string
                  enum:
                    - administrator
                    - subscriber
                    - editor
                    - author
                    - contributor
                  description: Role to assign on each target site.
                send_password:
                  type: boolean
                  description: Send password.
                user_url:
                  type: string
                  description: User website.
                username:
                  type: string
                  description: Username.
                websites:
                  type: string
                  description: Websites child site field IDs.
              required:
                - email
                - username
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/users/import:
    post:
      operationId: postUsersImport
      summary: Import users from a CSV file
      description: Creates users from an uploaded CSV file. Send the request as `multipart/form-data`. The response
        is an import report and has no `success` key.
      tags:
        - Users
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                csv_file:
                  type: string
                  format: binary
                  description: CSV file holding one user per row.
                has_header:
                  type: boolean
                  default: true
                  description: Skip the first row of the file as a header row.
              required:
                - csv_file
      responses:
        '200':
          description: The import report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserImportReport'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.

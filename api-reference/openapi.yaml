    SiteBatchUpdateItem:
      type: object
      description: One site update inside a batch request. The site is looked up by `id`.
      properties:
        id:
          type: integer
          description: ID of the record to update.
        name:
          type: string
          description: Name to show for the site in the Dashboard.
        adminname:
          type: string
          description: Administrator username on the child site.
        groupids:
          type: string
          description: Comma separated tag IDs the site belongs to.
        client_id:
          type: integer
          description: Client the site belongs to.
        uniqueid:
          type: string
          writeOnly: true
          description: Unique Security ID configured on the child site.
        http_user:
          type: string
          writeOnly: true
          description: Username for HTTP Basic authentication in front of the child site.
        http_pass:
          type: string
          writeOnly: true
          description: Password for HTTP Basic authentication in front of the child site.
        protocol:
          type: string
          description: Scheme used to reach the site.
        sslversion:
          type: string
          description: SSL version to force for requests to this site.
        force_use_ipv4:
          type: boolean
          description: Force IPv4 for requests to this site.
        disablehealthchecking:
          type: integer
          enum:
            - 0
            - 1
          description: Set to 1 to stop running site health checks.
        healththreshold:
          type: integer
          description: Health score below which the site counts as unhealthy.
        suspended:
          type: integer
          enum:
            - 0
            - 1
          description: Set to 1 to suspend the site.
        automatic_update:
          type: integer
          enum:
            - 0
            - 1
          description: Set to 1 to include the site in automatic updates.
        backup_before_upgrade:
          type: integer
          description: Set to 1 to run a backup before updates.
        ignore_core_updates:
          type: integer
          enum:
            - 0
            - 1
          description: Set to 1 to hide pending core updates for this site.
        ignore_plugin_updates:
          type: integer
          enum:
            - 0
            - 1
          description: Set to 1 to hide pending plugin updates for this site.
        ignore_theme_updates:
          type: integer
          enum:
            - 0
            - 1
          description: Set to 1 to hide pending theme updates for this site.
        monitoring_emails:
          type: string
          description: Comma separated addresses that receive monitoring notices for this site.
      required:
        - id
    SiteCreateInput:
      type: object
      description: Connection details for a site being added to the Dashboard.
      properties:
        url:
          type: string
          format: uri
          description: URL of the child site, including the scheme.
        admin:
          type: string
          description: Administrator username on the child site.
        adminpassword:
          type: string
          writeOnly: true
          description: Administrator password, required when the child site uses Password Authentication.
        uniqueid:
          type: string
          writeOnly: true
          description: Unique Security ID, required when the child site has one set.
        name:
          type: string
          description: Name to show for the site in the Dashboard.
        groupids:
          type: string
          description: Comma separated tag IDs to assign the site to.
        client_id:
          type: integer
          description: Client to assign the site to.
        ssl_verify:
          type: boolean
          description: Verify the SSL certificate of the child site.
        force_use_ipv4:
          type: boolean
          description: Force IPv4 for requests to this site.
        http_user:
          type: string
          writeOnly: true
          description: Username for HTTP Basic authentication in front of the child site.
        http_pass:
          type: string
          writeOnly: true
          description: Password for HTTP Basic authentication in front of the child site.
      required:
        - admin
        - url

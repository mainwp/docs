  /wp-json/mainwp/v2/updates/update:
    post:
      operationId: postUpdatesUpdate
      summary: Run updates on all sites
      description: Starts the pending updates across every site. The response carries a `job_id` and `queued_count`
        when the Dashboard queues the work. Job status is exposed through the `mainwp/get-batch-job-status-v1` ability
        on the WordPress Abilities API, which uses WordPress authentication rather than the MainWP API key; no MainWP
        REST API v2 route serves it.
      tags:
        - Updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Update types to run, comma separated. Accepts `all`, `wp`, `plugins`, `themes`, and
                    `translations`.
      responses:
        '200':
          description: Success. The shape depends on whether the Dashboard ran the work inline or queued it.
          content:
            application/json:
              schema:

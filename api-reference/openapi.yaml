  /wp-json/mainwp/v2/sites:
    get:
      operationId: getSites
      summary: List sites
      description: Returns the stored record for every connected site. Set `full_data` or `with_tags` to `false`
        to trim the payload.
      tags:
        - Sites
      parameters:
        - name: page
          in: query
          description: Page of the result set to return.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of records per page.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          description: Return only records matching this string.
          required: false
          schema:
            type: string
        - name: include
          in: query
          description: Comma separated list of IDs to limit the result set to.
          required: false
          schema:
            type: string
        - name: exclude
          in: query
          description: Comma separated list of IDs to leave out of the result set.
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Connection status to filter on.
          required: false
          schema:
            type: string
            enum:
              - any
              - connected
              - disconnected
              - suspended
              - available_update
        - name: with_tags
          in: query
          description: Include the tags assigned to each site.
          required: false
          schema:
            type: boolean
            default: true
        - name: full_data
          in: query
          description: Include the full stored record instead of the core fields only.
          required: false
          schema:
            type: boolean
            default: true
        - name: custom_fields
          in: query
          description: Comma separated list of extra fields to add to each record.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

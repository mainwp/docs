components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key created under MainWP Dashboard > API Access > API Keys, sent as `Authorization: Bearer
        <key>`.'
  schemas:
    Success:
      type: object
      description: Standard success envelope. The shape of `data` depends on the endpoint, and list endpoints add
        `total`.
      properties:
        success:
          type: integer
          enum:
            - 0
            - 1
          description: 1 when the call succeeded. Some routes report a failed action as 0 inside an HTTP 200 response.
        message:
          type: string
          description: Human readable result, present on most write calls.
        data:
          description: Payload the route returns.
        total:
          type: integer
          description: Number of records in the full result set.
        pages:
          type: integer
          description: Number of pages in the full result set.
      required:
        - success
    SuccessMessage:
      type: object
      description: Success envelope for calls that return no payload.
      properties:
        success:
          type: integer
          enum:
            - 0
            - 1
          description: 1 when the call succeeded. Some routes report a failed action as 0 inside an HTTP 200 response.
        message:
          type: string
          description: Human readable result.
      required:
        - success
    QueuedAction:
      type: object
      description: Returned when the Dashboard queues the work instead of running it inline. Job status is exposed
        through the `mainwp/get-batch-job-status-v1` ability on the WordPress Abilities API, which uses WordPress
        authentication rather than the MainWP API key; no MainWP REST API v2 route serves it.
      properties:
        success:
          type: integer
          enum:
            - 1
        message:
          type: string
          description: Human readable result.
        job_id:
          type: string
          description: Job identifier to pass to the `mainwp/get-batch-job-status-v1` ability.
        queued_count:
          type: integer
          description: Number of items placed on the queue.
        total:
          type: integer
          description: Number of items the call covered.
      required:
        - success
    UpdateRunStarted:
      type: object
      description: Returned when an update run starts inline.
      properties:
        success:
          type: integer
          enum:
            - 1
        message:
          type: string
          description: Human readable result.
        last_time_start_batch_updates:
          type: string
          description: When the Dashboard last started a batch update run.
        summary:
          description: Per-site outcome, present when the run finished inline.
        site:
          description: The site the run covered, on the per-site route.
      required:
        - success
    Error:
      type: object
      description: WordPress REST API error body.
      properties:
        code:
          type: string
          description: Machine readable error code.
        message:
          type: string
          description: Human readable error text.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
      required:
        - code
        - message
    SitesCount:
      type: object
      description: Bare count response. This route does not send the `success` key.
      properties:
        count:
          type: integer
          description: Number of matching sites.
    TotalCount:
      type: object
      properties:
        success:
          type: integer
          enum:
            - 1
        total:
          type: integer
          description: Number of matching records.
    CountResult:
      type: object
      properties:
        success:
          type: integer
          enum:
            - 0
            - 1
          description: 1 when the count was produced, 0 when the monitor or its data could not be found.
        count:
          type: integer
          description: Number of matching records.
    SiteRecord:
      type: object
      description: Bare site response. This route does not send the `success` key.
      properties:
        data:
          type: object
          description: The stored site record.
    BulkSiteResult:
      type: object
      description: Per-site outcome of a fleet-wide action. This shape does not carry the `success` key.
      properties:
        total:
          type: integer
          description: Number of sites the action covered.
        data:
          type: object
          description: Outcome per site, keyed by site ID.
          additionalProperties: {}
    BatchResult:
      type: object
      description: Per-item results keyed by action group, for example `create`, `update`, and `delete`. Failed
        items carry an `error` object in place of the record.
      additionalProperties: {}
    ApiKeyCreated:
      type: object
      properties:
        success:
          type: integer
          enum:
            - 1
        message:
          type: string
          description: Human readable result.
        token:
          type: string
          description: The bearer token. Shown once and not retrievable later.
    UserImportReport:
      type: object
      description: Result of a CSV import. This route does not send the `success` key.
      properties:
        total:
          type: integer
          description: Rows read from the file.
        success_count:
          type: integer
          description: Rows that created a user.
        failed_count:
          type: integer
          description: Rows that failed.
        success_users:
          type: array
          description: Created users, with the row each came from.
          items:
            type: object
        failed_users:
          type: array
          description: Failed rows, each with the reason.
          items:
            type: object
    DestroySessionsStarted:
      type: object
      description: Acknowledgement that the destroy sessions job was queued.
      properties:
        success:
          type: integer
          enum:
            - 1
        message:
          type: string
          description: Human readable result.
        destroy_id:
          type: string
          description: Identifier to poll the status route with.
        status_url:
          type: string
          format: uri
          description: Full URL of the status route for this job.
    RenewConnectionsStarted:
      type: object
      description: Acknowledgement that the renew connections job was queued.
      properties:
        success:
          type: integer
          enum:
            - 1
        message:
          type: string
          description: Human readable result.
        renew_id:
          type: string
          description: Identifier to poll the status route with.
        status_url:
          type: string
          format: uri
          description: Full URL of the status route for this job.
    DisconnectAllSitesStarted:
      type: object
      description: Acknowledgement that the disconnect all sites job was queued.
      properties:
        success:
          type: integer
          enum:
            - 1
        message:
          type: string
          description: Human readable result.
        disconnect_id:
          type: string
          description: Identifier to poll the status route with.
        status_url:
          type: string
          format: uri
          description: Full URL of the status route for this job.
    ToolJobStatus:
      type: object
      description: Progress of a background maintenance job.
      properties:
        success:
          type: boolean
        status:
          type: string
          description: Current job state.
        total:
          type: integer
          description: Items the job covers.
        processed:
          type: integer
          description: Items handled so far.
        failed:
          type: integer
          description: Items that failed.
        progress:
          type: number
          description: Completion as a percentage.
        errors:
          type: array
          description: Errors recorded so far.
          items:
            type: object
            properties:
              site_id:
                type: integer
                description: Site the error belongs to.
              error:
                type: string
                description: Error text.
        started_at:
          type:
            - string
            - 'null'
          description: Reserved. Current Dashboard versions return an empty string or null.
        completed_at:
          type:
            - integer
            - string
            - 'null'
          description: Unix timestamp of when the job finished. An empty string or null while the job is still running.
    ClientBatchUpdateItem:
      type: object
      description: One client update inside a batch request. The client is looked up by `id`.
      properties:
        id:
          type: integer
          description: ID of the record to update.
        name:
          type: string
          description: Client name.
        client_email:
          type: string
          format: email
          description: Primary contact email.
        client_phone:
          type: string
          description: Primary contact phone number.
        address_1:
          type: string
          description: Street address, first line.
        address_2:
          type: string
          description: Street address, second line.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State or region.
        zip:
          type: string
          description: Postal code.
        country:
          type: string
          description: Country.
        note:
          type: string
          description: Free-form note stored with the client.
        client_facebook:
          type: string
          description: Facebook profile URL.
        client_twitter:
          type: string
          description: X, formerly Twitter, profile URL.
        client_instagram:
          type: string
          description: Instagram profile URL.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sites:
                  type: object
                  description: Site actions. Only this group takes the action arrays.
                  properties:
                    create:
                      type: array
                      description: Sites to connect. Same fields as `POST /sites/add`.
                      items:
                        $ref: '#/components/schemas/SiteCreateInput'
                    sync:
                      type: array
                      description: Site IDs to sync.
                      items:
                        type: integer
                    reconnect:
                      type: array
                      description: Site IDs to reconnect.
                      items:
                        type: integer
                    disconnect:
                      type: array
                      description: Site IDs to disconnect.
                      items:
                        type: integer
                    suspend:
                      type: array
                      description: Site IDs to suspend.
                      items:
                        type: integer
                    check:
                      type: array
                      description: Site IDs to run a connection check against.
                      items:
                        type: integer
                    remove:
                      type: array
                      description: Site IDs to remove from the Dashboard.
                      items:
                        type: integer
                    security:
                      type: array
                      description: Site IDs to return a security snapshot for.
                      items:
                        type: integer
                    plugins:
                      type: array
                      description: Site IDs to return the installed plugins for.
                      items:
                        type: integer
                    themes:
                      type: array
                      description: Site IDs to return the installed themes for.
                      items:
                        type: integer
                    non-mainwp-changes:
                      type: array
                      description: Site IDs to return changes made outside MainWP for.
                      items:
                        type: integer
                clients:
                  type: object
                  properties:
                    create:
                      type: array
                      description: Clients to create. Same fields as `POST /clients/add`.
                      items:
                        $ref: '#/components/schemas/ClientCreateInput'
                costs:
                  type: object
                  properties:
                    create:
                      type: array
                      description: Cost records to create. Same fields as `POST /costs/add`.
                      items:
                        $ref: '#/components/schemas/CostInput'
                tags:
                  type: object
                  properties:
                    create:
                      type: array
                      description: Tags to create. Same fields as `POST /tags/add`.
                      items:
                        $ref: '#/components/schemas/TagCreateInput'
                updates:
                  type: object
                  properties:
                    create:
                      type: array
                      description: 'Accepted by the route but not implemented: the updates controller has no create
                        handler, so every item comes back as an `invalid-method` error. Use the routes under `/updates`
                        instead.'
                      items:
                        type: object
      responses:
        '200':
          description: Per-item results, grouped the same way as the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/clients:
    get:
      operationId: getClients
      summary: List clients
      description: Returns the stored client records.
      tags:
        - Clients
      parameters:
        - name: page
          in: query
          description: Page of the result set to return.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of records per page.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          description: Return only records matching this string.
          required: false
          schema:
            type: string
        - name: include
          in: query
          description: Comma separated list of IDs to limit the result set to.
          required: false
          schema:
            type: string
        - name: exclude
          in: query
          description: Comma separated list of IDs to leave out of the result set.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/clients/add:
    post:
      operationId: postClientsAdd
      summary: Create a client
      description: Creates a client record and optionally assigns sites to it.
      tags:
        - Clients
      parameters:
        - name: context
          in: query
          description: Scope of the request. Determines which fields the response carries.
          required: false
          schema:
            type: string
            default: view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateInput'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/clients/batch:
    post:
      operationId: postClientsBatch
      summary: Batch create, update, and delete clients
      description: Creates, updates, and deletes clients in one request. The response is a map of action group to
        per-item results, not the standard envelope.
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                create:
                  type: array
                  description: Clients to create.
                  items:
                    $ref: '#/components/schemas/ClientCreateInput'
                update:
                  type: array
                  description: Clients to update. Each item is looked up by its `id`.
                  items:
                    $ref: '#/components/schemas/ClientBatchUpdateItem'
                delete:
                  type: array
                  description: IDs of records to delete.
                  items:
                    type: integer
      responses:
        '200':
          description: Per-item results, grouped the same way as the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: putClientsBatch
      summary: Batch create, update, and delete clients
      description: Creates, updates, and deletes clients in one request. The response is a map of action group to
        per-item results, not the standard envelope.
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                create:
                  type: array
                  description: Clients to create.
                  items:
                    $ref: '#/components/schemas/ClientCreateInput'
                update:
                  type: array
                  description: Clients to update. Each item is looked up by its `id`.
                  items:
                    $ref: '#/components/schemas/ClientBatchUpdateItem'
                delete:
                  type: array
                  description: IDs of records to delete.
                  items:
                    type: integer
      responses:
        '200':
          description: Per-item results, grouped the same way as the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchClientsBatch
      summary: Batch create, update, and delete clients
      description: Creates, updates, and deletes clients in one request. The response is a map of action group to
        per-item results, not the standard envelope.
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                create:
                  type: array
                  description: Clients to create.
                  items:
                    $ref: '#/components/schemas/ClientCreateInput'
                update:
                  type: array
                  description: Clients to update. Each item is looked up by its `id`.
                  items:
                    $ref: '#/components/schemas/ClientBatchUpdateItem'
                delete:
                  type: array
                  description: IDs of records to delete.
                  items:
                    type: integer
      responses:
        '200':
          description: Per-item results, grouped the same way as the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/clients/count:
    get:
      operationId: getClientsCount
      summary: Count clients
      description: Returns how many clients match the filters.
      tags:
        - Clients
      parameters:
        - name: search
          in: query
          description: Return only records matching this string.
          required: false
          schema:
            type: string
        - name: include
          in: query
          description: Comma separated list of IDs to limit the result set to.
          required: false
          schema:
            type: string
        - name: exclude
          in: query
          description: Comma separated list of IDs to leave out of the result set.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The number of matching records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalCount'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/clients/fields:
    get:
      operationId: getClientsFields
      summary: List client fields
      description: Lists the custom client fields defined on the Dashboard.
      tags:
        - Clients
      parameters:
        - name: exclude
          in: query
          description: Exclude client field IDs.
          required: false
          schema:
            type: string
        - name: include
          in: query
          description: Include client field IDs.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pre_page
          in: query
          description: Number of client fields per page. The name is spelled `pre_page` on this route, not `per_page`.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: search
          in: query
          description: Search client field name.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/clients/fields/add:
    post:
      operationId: postClientsFieldsAdd
      summary: Create a client field
      description: Creates a custom client field.
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Field description.
                name:
                  type: string
                  description: Field name.
              required:
                - description
                - name
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/clients/fields/{id_name}/delete:
    parameters:
      - name: id_name
        in: path
        description: Client field ID or field name.
        required: true
        schema:
          type: string
    delete:
      operationId: deleteClientsFieldsIdNameDelete
      summary: Delete a client field
      description: Deletes a custom client field and the values stored against it.
      tags:
        - Clients
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No record matches the identifier in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wp-json/mainwp/v2/clients/fields/{id_name}/edit:
    parameters:
      - name: id_name
        in: path
        description: Client field ID or field name.
        required: true
        schema:
          type: string
    put:
      operationId: putClientsFieldsIdNameEdit
      summary: Update a client field
      description: Renames a custom client field or changes its description.
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Field description.
                name:
                  type: string
                  description: Field name.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: The API key is missing, malformed, or disabled, or does not carry the permission this method
            needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No record matches the identifier in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchClientsFieldsIdNameEdit
      summary: Update a client field
      description: Renames a custom client field or changes its description.
